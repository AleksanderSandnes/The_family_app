name: Backend Security Tests
on:
  push:
    branches: [master, test, "task/**"]
  pull_request:
    branches: [master, test]
permissions:
  contents: read
concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/push-on-message/index.ts supabase/functions/daily-reminders/index.ts supabase/functions/delete-account/index.ts supabase/tests/account_deletion_http.ts
      - run: deno test --allow-env supabase/functions/_shared/*_test.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start isolated validation database
        run: |
          mkdir -p "$RUNNER_TEMP/family-db-validation"
          supabase init --workdir "$RUNNER_TEMP/family-db-validation"
          supabase start --workdir "$RUNNER_TEMP/family-db-validation" \
            --exclude realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Restore captured schema and verify function restrictions
        run: |
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/baseline/20260930_public.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/security/function_access.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/function_access.sql
      - name: Verify report and block moderation isolation
        run: |
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/security/moderation.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/moderation.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/function_access.sql
      - name: Verify Vault-backed webhook installation
        run: |
          echo "select vault.create_secret('local-test-server-key', 'family_push_webhook_key');" | \
            docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/post_deploy/push_webhook.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/function_access.sql
      - name: Verify storage write isolation against legacy policies
        run: |
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/add_storage_buckets.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/add_wish_images_bucket.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/add_chat_media_bucket.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/security/storage_writes.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/storage_writes.sql
      - name: Verify private-read isolation and write compatibility
        run: |
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/security/storage_reads.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/storage_reads.sql
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/storage_writes.sql
      - name: Verify private media through real local Auth and Storage APIs
        run: python3 supabase/tests/private_media_http.py --workdir "$RUNNER_TEMP/family-db-validation"
      - name: Verify account deletion through real local Auth and Storage APIs
        run: |
          docker exec -i supabase_db_family-db-validation psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/security/account_deletion.sql
          deno run --allow-env --allow-net --allow-run --allow-read supabase/tests/account_deletion_http.ts "$RUNNER_TEMP/family-db-validation"
      - name: Stop isolated database
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/family-db-validation"

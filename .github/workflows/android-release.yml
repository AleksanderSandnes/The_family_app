name: Android Release
# Manual, owner-approved signed Android build. Inactive until the repository variable
# RELEASE_ANDROID_ENABLED is "true"; the production environment adds the approval gate.
# Play upload is a separate opt-in input and never runs on its own.
on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: Upload the verified bundle to the Play internal track
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/master' && vars.RELEASE_ANDROID_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.mjs
      - name: Require a released production tip with passing quality workflows
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/pipeline.mjs | tee "$RUNNER_TEMP/pipeline.txt"
          grep -qx 'ready=true' "$RUNNER_TEMP/pipeline.txt" || { echo "Production tip is not release-ready" >&2; exit 1; }
  bundle:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD: ${{ needs.verify.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate public client configuration
        working-directory: scripts/release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node client-config.mjs
      - name: Write signing and client configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          {
            printf 'release.keystore=release.keystore\n'
            printf 'store.password=%s\n' "$STORE_PASSWORD"
            printf 'key.alias=%s\n' "$KEY_ALIAS"
            printf 'key.password=%s\n' "$KEY_PASSWORD"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > android/local.properties
      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify signature and version
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q 'jar verified'
          grep -Eq "versionName \"$VERSION\"" android/app/build.gradle
          grep -Eq "versionCode $BUILD\$" android/app/build.gradle
          cp "$aab" "family-app-$VERSION-build$BUILD.aab"
          sha256sum "family-app-$VERSION-build$BUILD.aab" | tee "family-app-$VERSION-build$BUILD.aab.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: family-app-${{ needs.verify.outputs.version }}-build${{ needs.verify.outputs.build }}
          path: family-app-*.aab*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore android/local.properties android/app/google-services.json
  play-internal:
    needs: [verify, bundle]
    if: inputs.submit_to_play && vars.RELEASE_PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-internal
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: family-app-${{ needs.verify.outputs.version }}-build${{ needs.verify.outputs.build }}
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sandnes.familyapp
          releaseFiles: family-app-*.aab
          track: internal
          status: draft

name: iOS Build and Tests
on:
  push:
    branches: [master, test, "task/**"]
  pull_request:
    branches: [master, test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Configure isolated test backend
        run: |
          cat > ios/Config/Secrets.xcconfig <<'EOF'
          SUPABASE_URL = https:/$()/example.supabase.co
          SUPABASE_ANON_KEY = ci-placeholder-not-a-secret
          EOF
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as source:
              devices = json.load(source)['devices']
          phones = [device for runtime, entries in devices.items() if 'iOS' in runtime
                    for device in entries if device['name'].startswith('iPhone') and device['isAvailable']]
          if not phones:
              raise SystemExit('No available iPhone simulator on this runner')
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Build and test without signing
        run: |
          set -o pipefail
          xcodebuild test -project ios/FamilyApp.xcodeproj -scheme FamilyApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ios/build -resultBundlePath ios/build/TestResults.xcresult \
            -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Coverage report
        run: |
          xcrun xccov view --report ios/build/TestResults.xcresult > ios/build/coverage.txt
          # Keep the complete file in the artifact; the function listing exceeds
          # GitHub's 1 MiB summary limit. Target totals remain visible on the run.
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          lines = Path('ios/build/coverage.txt').read_text().splitlines()
          targets = [line for line in lines if line and not line.startswith(' ') and '.app' in line]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## iOS coverage\n\n```text\n' + '\n'.join(targets) + '\n```\n')
              summary.write('Full file and function coverage is in the ios-test-results artifact.\n')
          PYREPORT
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/build/TestResults.xcresult
            ios/build/coverage.txt
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
